<!doctype html>
<meta charset="utf-8">
<style>
  /* The self-hosted faces the site itself uses. Loading them from disk rather
     than a CDN is what makes the Hebrew render as the real thing. */
  @font-face { font-family: 'Frank Ruhl Libre'; src: url('../../public/fonts/frank-ruhl-libre-hebrew.woff2') format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'Frank Ruhl Libre'; src: url('../../public/fonts/frank-ruhl-libre-latin.woff2') format('woff2'); font-weight: 400 700; unicode-range: U+0000-024F; }
  @font-face { font-family: 'Assistant'; src: url('../../public/fonts/assistant-hebrew.woff2') format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'Assistant'; src: url('../../public/fonts/assistant-latin.woff2') format('woff2'); font-weight: 400 700; unicode-range: U+0000-024F; }

  :root {
    --sea:   #0E93AE;
    --night: #173A5E;
    --ink:   #0C1116;
    --amber: #F0B45C;
    --sand:  #E0CFB4;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    /* Dusk over the promenade, which is the hour this site is for. */
    background:
      radial-gradient(1100px 620px at 84% -12%, rgba(14,147,174,.55), transparent 62%),
      radial-gradient(760px 520px at 8% 108%, rgba(240,180,92,.20), transparent 60%),
      linear-gradient(155deg, var(--night) 0%, var(--ink) 78%);
    color: #fff;
    font-family: 'Assistant', system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 74px 84px;
  }
  .brand {
    display: flex; align-items: center; gap: 14px;
    font-size: 27px; font-weight: 700; letter-spacing: .02em;
    color: rgba(224,207,180,.92);
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--amber); }
  h1 {
    font-family: 'Frank Ruhl Libre', Georgia, serif;
    font-size: 92px; line-height: 1.06; font-weight: 700; letter-spacing: -.015em;
    max-width: 15ch;
  }
  .sub { margin-top: 22px; font-size: 33px; color: rgba(255,255,255,.80); }
  /* The three services, named but never given a time: a shared image cannot
     carry a real one, and an invented one is the single thing this project
     refuses to do. */
  .services { display: flex; gap: 13px; }
  .pill {
    border: 1px solid rgba(224,207,180,.34); border-radius: 999px;
    padding: 11px 25px; font-size: 26px; color: rgba(224,207,180,.95);
  }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 25px; color: rgba(255,255,255,.62);
  }
  body[dir='ltr'] h1 { max-width: 17ch; }
</style>
<body>
  <div class="brand"><span class="dot"></span><span id="brand"></span></div>
  <div>
    <h1 id="tagline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="services" id="services"></div>
  <div class="foot"><span id="where"></span><span id="host"></span></div>
</body>
